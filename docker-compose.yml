services:
  hytale-server:
    image: voidcube/hytale-server
    build:
      context: .
      platforms: [linux/amd64]
    container_name: hytale-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "5520:5520/udp"
    volumes:
      - ./hytale-data:/data
    stdin_open: true
    tty: true
